server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mirror of the Vite dev proxy: the UI calls relative /api paths and
    # nginx forwards them to the api service on the compose network.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
