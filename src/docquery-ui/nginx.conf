server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mirror of the Vite dev proxy: the UI calls relative /api paths and
    # nginx forwards them to the api service on the compose network.
    location /api/ {
        # nginx defaults to a 1 MB body limit — far too small for PDF uploads.
        # 30m matches Kestrel's default max request body size, so nginx and
        # the API agree on the upload ceiling.
        client_max_body_size 30m;
        # SSE streaming: without these, nginx buffers the event stream and
        # token-by-token answers arrive as one lump. The read timeout covers
        # slow local models (70B answers can take a minute+).
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
